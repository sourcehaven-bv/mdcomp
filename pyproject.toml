[project]
name = "mdcomp"
version = "0.1.0"
description = "Compose documents from Markdown snippets and templates"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
keywords = [
    "markdown",
    "jinja2",
    "templates",
    "documents",
    "cli",
    "composition",
    "documentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "mistletoe>=1.5.1",
]


[project.optional-dependencies]
watch = ["watchfiles>=0.21"]

[project.scripts]
mdcomp = "mdcomp.cli:app"

[project.urls]
Homepage = "https://github.com/sourcehaven-bv/mdcomp"
Documentation = "https://github.com/sourcehaven-bv/mdcomp#readme"
Repository = "https://github.com/sourcehaven-bv/mdcomp"
Changelog = "https://github.com/sourcehaven-bv/mdcomp/blob/main/CHANGELOG.md"
Issues = "https://github.com/sourcehaven-bv/mdcomp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdcomp"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "PERF",   # perflint (performance anti-patterns)
    "FURB",   # refurb (modern python)
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLC0415",  # import not at top level (intentional lazy imports)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/mdcomp/query.py" = ["PERF203", "S112"]  # try-except in loop is acceptable for file parsing
"src/mdcomp/render.py" = ["S602", "S603", "S607", "S701"]  # intentional shell execution + autoescape is configured via select_autoescape
"src/mdcomp/filters.py" = ["S602", "S603", "S607"]  # intentional shell execution (pipe filter)
"tests/*" = ["S101", "S110"]  # assert is fine in tests; bare except pass in fuzz tests

[tool.ruff.lint.isort]
known-first-party = ["mdcomp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["frontmatter.*", "mistletoe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = []

[tool.pylint.main]
jobs = 0  # auto-detect CPU cores

[tool.pylint."messages control"]
# Disable most checks since ruff handles them; keep duplication only
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "vulture>=2.11",
    "pylint>=3.0",
    "pre-commit>=4.0",
    "watchfiles>=0.21",
]
